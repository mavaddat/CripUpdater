# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test --no-build --verbosity normal
    
    # OPTIMIZATION 1: Only publish & upload artifacts on push to main, 
    # skipping this heavy step on Dependabot/User Pull Requests.
    - name: Publish
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: dotnet publish --configuration Release -r win-x64
      
    - name: Upload artifacts
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: publish
        path: ./bin/Release/net10.0-windows/win-x64/publish
  
  release:
    needs: build
    runs-on: ubuntu-latest
    # OPTIMIZATION 2: Standardizing safety check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
  
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      
    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: |
          publish/*.exe
          publish/*.pdb
          publish/scripts/*.ps1
        body: "Release ${{ github.run_number }} (${{ github.sha }})"
        token: "${{ secrets.GITHUB_TOKEN }}"
        tag: "release-${{ github.run_number }}"
        name: "Release ${{ github.run_number }} (${{ github.sha }})"
        draft: false
        prerelease: false
