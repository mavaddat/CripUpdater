version: 2
updates:
  # NuGet Package Updates for CripUpdater
  - package-ecosystem: "nuget"
    directory: "/" # Scans the root folder for CripUpdater.csproj
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3

    # Ensures Dependabot respects your current prerelease track 
    versioning-strategy: increase

    # Explicitly allow direct dependencies to keep looking for updates
    allow:
      - dependency-type: "direct"

  # GitHub Actions Workflow Updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
